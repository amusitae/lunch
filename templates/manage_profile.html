 {% extends "base.html" %}

{% block content %}
<div class="container mt-4 mb-5">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-6">

            <!-- Profile Information -->
            <div class="card shadow-sm mb-4">
                <div class="card-header">
                    <h4 class="mb-0">Manage Profile</h4>
                </div>

                <div class="card-body">
                    <p class="text-muted">
                        View and update your personal account information.
                    </p>

                    <form method="POST"
                          action="{{ url_for('user.manage_profile') }}">

                        <input type="hidden" name="action" value="profile">

                        <div class="mb-3">
                            <label for="fullname" class="form-label">
                                Full Name
                            </label>
                            <input
                                type="text"
                                class="form-control"
                                id="fullname"
                                name="fullname"
                                value="{{ fullname }}"
                                required
                            >
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label">
                                Email Address
                            </label>
                            <input
                                type="email"
                                class="form-control"
                                id="email"
                                name="email"
                                value="{{ email }}"
                                required
                            >
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary">
                                Save Changes
                            </button>

                            <a href="{{ url_for('user.dashboard') }}"
                               class="btn btn-outline-secondary">
                                Back to Dashboard
                            </a>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Change Password -->
            <div class="card shadow-sm">
                <div class="card-header">
                    <h5 class="mb-0">Change Password</h5>
                </div>

                <div class="card-body">
                    <p class="text-muted">
                        Enter your current password before choosing a new one.
                    </p>

                    <form method="POST"
                          action="{{ url_for('user.manage_profile') }}">

                        <input type="hidden" name="action" value="password">

                        <div class="mb-3">
                            <label for="current_password" class="form-label">
                                Current Password
                            </label>
                            <input
                                type="password"
                                class="form-control"
                                id="current_password"
                                name="current_password"
                                autocomplete="current-password"
                                required
                            >
                        </div>

                        <div class="mb-3">
                            <label for="new_password" class="form-label">
                                New Password
                            </label>
                            <input
                                type="password"
                                class="form-control"
                                id="new_password"
                                name="new_password"
                                autocomplete="new-password"
                                minlength="8"
                                required
                            >
                            <div class="form-text">
                                Use at least 8 characters.
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="confirm_new_password" class="form-label">
                                Confirm New Password
                            </label>
                            <input
                                type="password"
                                class="form-control"
                                id="confirm_new_password"
                                name="confirm_new_password"
                                autocomplete="new-password"
                                minlength="8"
                                required
                            >
                        </div>

                        <button type="submit" class="btn btn-success">
                            Update Password
                        </button>
                    </form>
                </div>
            </div>

        </div>
    </div>
</div>
{% endblock %}
