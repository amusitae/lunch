{% extends "base.html" %}

{% block title %}
Register
{% endblock %}

{% block content %}

<section class="py-5">

    <div class="container">

        <div class="row justify-content-center">

            <div class="col-lg-6">

                <div class="card shadow border-0 rounded-4">

                    <div class="card-body p-5">

                        <h2 class="text-center fw-bold text-success mb-4">
                            Create Account
                        </h2>

                        <form action="/register" method="POST">

                            <div class="mb-3">
                                <label class="form-label">
                                    Full Name
                                </label>

                                <input
                                    type="text"
                                    class="form-control"
                                    name="fullname"
                                    placeholder="Enter your full name"
                                    required>
                            </div>


                            <div class="mb-3">
                                <label class="form-label">
                                    Email Address
                                </label>

                                <input
                                    type="email"
                                    class="form-control"
                                    name="email"
                                    placeholder="Enter your email"
                                    required>
                            </div>


                            <!-- Allergy -->
                            <div class="mb-3">

                                <label class="form-label">
                                    Food Allergy
                                </label>

                                <select
                                    class="form-select"
                                    name="allergy">

                                    <option value="None">
                                        No Allergy
                                    </option>

                                    <option value="Fish/Seafood">
                                        Fish / Seafood
                                    </option>

                                    <option value="Dairy">
                                        Dairy / Milk
                                    </option>

                                    <option value="Eggs">
                                        Eggs
                                    </option>

                                    <option value="Peanuts">
                                        Peanuts
                                    </option>

                                    <option value="Nuts">
                                        Nuts
                                    </option>

                                    <option value="Gluten">
                                        Gluten
                                    </option>

                                </select>

                                <small class="text-muted">
                                    Select your food allergy so LunchPilot can avoid
                                    unsuitable meals.
                                </small>

                            </div>


                            <div class="mb-3">

                                <label class="form-label">
                                    Password
                                </label>

                                <input
                                    type="password"
                                    class="form-control"
                                    name="password"
                                    placeholder="Create a password"
                                    required>

                            </div>


                            <div class="mb-4">

                                <label class="form-label">
                                    Confirm Password
                                </label>

                                <input
                                    type="password"
                                    class="form-control"
                                    name="confirm_password"
                                    placeholder="Confirm your password"
                                    required>

                            </div>


                            <button
                                type="submit"
                                class="btn btn-success w-100">

                                Create Account

                            </button>

                        </form>


                        <p class="text-center mt-4">

                            Already have an account?

                            <a href="{{ url_for('auth.login') }}"
                               class="text-success">

                                Login

                            </a>

                        </p>

                    </div>

                </div>

            </div>

        </div>

    </div>

</section>

{% endblock %}
