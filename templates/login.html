{% extends "base.html" %}

{% block title %}
Login
{% endblock %}

{% block content %}

<section class="py-5">

    <div class="container">

        <div class="row justify-content-center">

            <div class="col-lg-5">

                <div class="card shadow border-0 rounded-4">

                    <div class="card-body p-5">

                        <h2 class="text-center fw-bold text-success mb-4">

                            Login

                        </h2>

                        <form action="/login" method="POST">

                            <div class="mb-3">

                                <label class="form-label">

                                    Email Address

                                </label>

                                <input
                                    type="email"
                                    class="form-control"
                                    name="email"
                                    placeholder="Enter your email"
                                    required>

                            </div>

                            <div class="mb-4">

                                <label class="form-label">

                                    Password

                                </label>

                                <input
                                    type="password"
                                    class="form-control"
                                    name="password"
                                    placeholder="Enter your password"
                                    required>

                            </div>

                            <button
                                type="submit"
                                class="btn btn-success w-100">

                                Login

                            </button>

                        </form>

                        <p class="text-center mt-4">

                            Don't have an account?

                            <a href="/register" class="text-success">

                                Register

                            </a>

                        </p>

                    </div>

                </div>

            </div>

        </div>

    </div>

</section>

{% endblock %}
